AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Corp Application

Parameters:
  Stage:
    Type: String
  AppAwsAccountId:
    Type: String
  AppAwsVpc:
    Type: String
  AppAwsSecurityGroup:
    Type: String
  AppAwsSubnet1:
    Type: String
  AppAwsSubnet2:
    Type: String
  AppSlsRegion:
    Type: String
  AppAwsAgencyCognitoUserPoolId:
    Type: String
  AppAwsWorkoCognitoUserPoolId:
    Type: String
  AppAwsSecretsManagerGcpFirestoreArnSecret:
    Type: String
  AppAwsSecretsManagerGcpAiPlatformArnSecret:
    Type: String
  AppAwsS3BucketWorkoCorporate:
    Type: String
  AppAwsS3BucketWorkoApp:
    Type: String
  AppAwsS3BucketWorkoAgencyBulkCvs:
    Type: String
  AppAwsS3BucketWorkoCorporateCandProfile:
    Type: String
  AppAwsS3BucketWorkoAdminCandProfile:
    Type: String
  AppAwsS3BucketWorkoCorporateReferralSourceCv:
    Type: String
  AppWorkoFrontendBaseUrl:
    Type: String
  AppWorkoAgencyFrontendBaseUrl:
    Type: String

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 512
    Environment:
      Variables:

        # Application
        APP_STAGE: !Ref Stage
        TZ: "GMT"

        # Serverless
        APP_SLS_STAGE: !Ref Stage
        APP_SLS_REGION: !Ref AppSlsRegion

        # AWS Account / Network
        APP_AWS_ACCOUNT_ID: !Ref AppAwsAccountId
        APP_AWS_VPC: !Ref AppAwsVpc
        APP_AWS_SECURITY_GROUP: !Ref AppAwsSecurityGroup
        APP_AWS_SUBNET1: !Ref AppAwsSubnet1
        APP_AWS_SUBNET2: !Ref AppAwsSubnet2
        APP_AWS_REGION: !Ref AppSlsRegion

        # S3 Buckets
        APP_AWS_S3_BUCKET_WORKO_CORPORATE: !Ref AppAwsS3BucketWorkoCorporate
        APP_AWS_S3_BUCKET_WORKO_APP: !Ref AppAwsS3BucketWorkoApp
        APP_AWS_S3_BUCKET_WORKO_AGENCY_BULK_CVS: !Ref AppAwsS3BucketWorkoAgencyBulkCvs
        APP_AWS_S3_BUCKET_WORKO_CORPORATE_CAND_PROFILE: !Ref AppAwsS3BucketWorkoCorporateCandProfile
        APP_AWS_S3_BUCKET_WORKO_ADMIN_CAND_PROFILE: !Ref AppAwsS3BucketWorkoAdminCandProfile
        APP_AWS_S3_BUCKET_WORKO_CORPORATE_REFERRAL_SOURCE_CV: !Ref AppAwsS3BucketWorkoCorporateReferralSourceCv

        # Cognito
        APP_AWS_WORKO_COGNITO_USER_POOL_ID: !Ref AppAwsWorkoCognitoUserPoolId
        APP_AWS_AGENCY_COGNITO_USER_POOL_ID: !Ref AppAwsAgencyCognitoUserPoolId

        # Secrets Manager
        APP_AWS_SECRETS_MANAGER_GCP_FIRESTORE: !Sub "GCP-firestore-secret-${Stage}"
        APP_AWS_SECRETS_MANAGER_GCP_FIRESTORE_ARN_SECRET: !Ref AppAwsSecretsManagerGcpFirestoreArnSecret
        APP_AWS_SECRETS_MANAGER_GCP_AI_PLATFORM: !Sub "GCP-aiplatform-secrect-${Stage}"
        APP_AWS_SECRETS_MANAGER_GCP_AI_PLATFORM_ARN_SECRET: !Ref AppAwsSecretsManagerGcpAiPlatformArnSecret

        # EventBridge
        APP_AWS_EVENT_BRIDGE_SCHEDULE_INVOKE_LAMBDA_ROLE: "worko-schedule-invoke-lambda-role"

        # Logging
        APP_LOGGER_LOG_FORMAT: "json"

        # Frontend URLs
        APP_WORKO_FRONTEND_BASE_URL: !Ref AppWorkoFrontendBaseUrl 
        APP_WORKO_AGENCY_FRONTEND_BASE_URL: !Ref AppWorkoAgencyFrontendBaseUrl

        # WhatsApp
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_BASE_URL: "https://partnersv1.pinbot.ai/v3"
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_KEY: "REDACTED_SECRET" 
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_FROM_PHONE_NUMBER_ID: "496822040188825"
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_FROM_PHONE_NUMBER: "919811929282"

        # GCP
        APP_GCP_AI_PLATFORM_EMBEDDING_MODEL_NAME: "text-embedding-004"
        APP_GCP_AI_PLATFORM_EMBEDDING_LOCATION: "asia-south1"

        # Project
        APP_GCP_PROJECT_ID: !Sub "worko-${Stage}"

        # Logo
        APP_WORKO_LOGO_URL: "https://worko.ai/assets/logo-text-Dfe5k43I.webp"

        APP_AWS_SCHEDULER_HANDLER_LAMBDA_ARN: !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-corp-${Stage}-appScheduler"
        APP_AWS_SCHEDULER_HANDLER_ROLE_ARN: !Sub "arn:aws:iam::${AppAwsAccountId}:role/worko-schedule-invoke-lambda-role"

        APP_RAZORPAY_KEY_ID: "rzp_test_yq5Mt1KeflWopy"
        APP_RAZORPAY_KEY_SECRET: "REDACTED_SECRET"

        # @todo Need to debug how to run application in local machine with nodemon
        # @note Use below envs only on your local machine
        # APP_AWS_AUTH_MOCK_USER_ID: "REDACTED_SECRET"
        # APP_AWS_AUTH_MOCK_USER_EMAIL: "rohithappala777+candidate3@gmail.com"

Resources:
  # IAM Role for Lambda Functions
  WorkoCorpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "worko-corp-${Stage}-${AppSlsRegion}-lambdaRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko/index/GSI1"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko/index/GSI2"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko-job-app"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko-job-app/index/GSI1"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko-job-app/index/GSI2"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko-job-app/index/GSI3"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko-count"
                  - !Sub "arn:aws:dynamodb:${AppSlsRegion}:*:table/worko-count/index/GSI1"
        
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:GetContactList
                  - ses:SendCustomVerificationEmail
                  - ses:UpdateContactList
                  - ses:UpdateEmailTemplate
                  - ses:GetEmailIdentityPolicies
                  - ses:GetEmailTemplate
                  - ses:CreateEmailTemplate
                  - ses:SendBulkEmail
                  - ses:GetEmailIdentity
                  - ses:CreateTemplate
                  - ses:UpdateTemplate
                  - ses:GetTemplate
                  - ses:DeleteTemplate
                  - ses:SendTemplatedEmail
                Resource: "*"
        
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoCorporate}"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoCorporate}/*"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoApp}"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoApp}/*"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoAgencyBulkCvs}"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoAgencyBulkCvs}/*"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoCorporateCandProfile}"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoCorporateCandProfile}/*"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoAdminCandProfile}"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoAdminCandProfile}/*"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoCorporateReferralSourceCv}"
                  - !Sub "arn:aws:s3:::${AppAwsS3BucketWorkoCorporateReferralSourceCv}/*"
        
        - PolicyName: LambdaInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:InvokeAsync
                Resource:
                  - !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-jd-resume-matching-${Stage}"
                  - !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-resume-parser-${Stage}"
                  - !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-job-app-${Stage}-app-opensearch-operations"
                  - !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-sourcetype-jd-resume-matching-${Stage}"
                  - !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-corp-${Stage}-app-sourcetype-bulk-find-jd-cv-match-score"
                  - !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-corp-${Stage}-appInvokeLambda"
        
        - PolicyName: SchedulerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  - !Sub "arn:aws:iam::${AppAwsAccountId}:role/worko-schedule-invoke-lambda-role"
                  - !Sub "arn:aws:scheduler:ap-south-1:${AppAwsAccountId}:schedule/*/*"
              - Effect: Allow
                Action:
                  - scheduler:GetScheduleGroup
                  - scheduler:DeleteScheduleGroup
                  - scheduler:CreateScheduleGroup
                Resource: !Sub "arn:aws:scheduler:ap-south-1:${AppAwsAccountId}:schedule-group/*"
        
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                Resource:
                  - !Sub "arn:aws:cognito-idp:ap-south-1:${AppAwsAccountId}:userpool/${AppAwsWorkoCognitoUserPoolId}"
                  - !Sub "arn:aws:cognito-idp:ap-south-1:${AppAwsAccountId}:userpool/${AppAwsAgencyCognitoUserPoolId}"
        
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AppSlsRegion}:${AppAwsAccountId}:secret:${AppAwsSecretsManagerGcpFirestoreArnSecret}"
                  - !Sub "arn:aws:secretsmanager:${AppSlsRegion}:${AppAwsAccountId}:secret:${AppAwsSecretsManagerGcpAiPlatformArnSecret}"
        
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub "arn:aws:sqs:${AppSlsRegion}:${AppAwsAccountId}:worko-corp-app-event-queue"

  # Lambda Functions
  WorkoCorpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-corp-${Stage}-workoCorp"
      Timeout: 900
      CodeUri: ./
      Handler: src/app.handler
      Role: !GetAtt WorkoCorpLambdaRole.Arn
      Events:
        # Explicit Preflight Root Route (NO Authorizer)
        PreflightRoot:
          Type: Api
          Properties:
            Path: /
            Method: OPTIONS
            RestApiId: !Ref WorkoCorpApi
            Auth:
              Authorizer: NONE
        ApiGateway:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref WorkoCorpApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app.ts
        External:
          - "@aws-sdk/*"

  AppSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-corp-${Stage}-appScheduler"
      Timeout: 900
      CodeUri: ./
      Handler: src/app-scheduler.handler
      Role: !GetAtt WorkoCorpLambdaRole.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app-scheduler.ts
        External:
          - "@aws-sdk/*"

  AppEventTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-corp-${Stage}-appeventtrigger"
      Timeout: 900
      CodeUri: ./
      Handler: src/app-event-trigger.handler
      Role: !GetAtt WorkoCorpLambdaRole.Arn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Sub "arn:aws:sqs:${AppSlsRegion}:${AppAwsAccountId}:worko-corp-app-event-queue"
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app-event-trigger.ts
        External:
          - "@aws-sdk/*"

  AppInvokeLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-corp-${Stage}-appInvokeLambda"
      Timeout: 900
      CodeUri: ./
      Handler: src/app-invoke-lambda.handler
      Role: !GetAtt WorkoCorpLambdaRole.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app-invoke-lambda.ts
        External:
          - "@aws-sdk/*"

  # API Gateway
  # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-controlling-access-to-apis-lambda-authorizer.html#serverless-controlling-access-to-apis-lambda-request-authorizer
  WorkoCorpApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Stage}-worko-corp"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,X-Amzn-Trace-Id'"
        AllowOrigin: "'*'"
        AllowCredentials: false
      Auth:
        DefaultAuthorizer: WorkoAuthAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false # Do NOT apply authorizer to OPTIONS.
        Authorizers:
          WorkoAuthAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-auth"
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 0

Outputs:
  WorkoCorpApi:
    Description: "API Gateway endpoint URL for Worko Corp application"
    Value: !Sub "https://${WorkoCorpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
  
  WorkoCorpFunctionArn:
    Description: "Worko Corp Lambda Function ARN"
    Value: !GetAtt WorkoCorpFunction.Arn
  
  AppSchedulerFunctionArn:
    Description: "App Scheduler Lambda Function ARN"
    Value: !GetAtt AppSchedulerFunction.Arn
  
  AppEventTriggerFunctionArn:
    Value: !GetAtt AppEventTriggerFunction.Arn
  
  AppInvokeLambdaFunctionArn:
    Value: !GetAtt AppInvokeLambdaFunction.Arn